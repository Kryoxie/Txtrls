<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Studio - Image Processor</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for custom typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        .bold-pill-font {
            font-family: 'Fredoka', 'Inter', sans-serif;
        }

        /* Custom Styling to replicate exact UI from wireframe mockup */
        .pill-btn {
            background: linear-gradient(180deg, #ffffff 0%, #e6e6e6 100%);
            border: 3px solid #1a1a1a;
            border-radius: 9999px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2), inset 0 2px 2px rgba(255, 255, 255, 0.8);
            transition: all 0.15s ease;
        }

        .pill-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 8px -1px rgba(0, 0, 0, 0.25), inset 0 2px 2px rgba(255, 255, 255, 0.9);
        }

        .pill-btn:active {
            transform: translateY(1px);
            box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.2);
        }

        /* Custom Styled Sliders */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]:focus {
            outline: none;
        }

        /* Track */
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 22px;
            cursor: pointer;
            background: #ffffff;
            border-radius: 12px;
            border: 2px solid #1a1a1a;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.15);
        }

        /* Thumb */
        input[type=range]::-webkit-slider-thumb {
            height: 32px;
            width: 32px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffffff, #dcdcdc);
            border: 2px solid #222222;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s ease;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.08);
        }

        /* Firefox Support */
        input[type=range]::-moz-range-track {
            width: 100%;
            height: 22px;
            cursor: pointer;
            background: #ffffff;
            border-radius: 12px;
            border: 2px solid #1a1a1a;
        }

        input[type=range]::-moz-range-thumb {
            height: 32px;
            width: 32px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffffff, #dcdcdc);
            border: 2px solid #222222;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* Canvas Container Checkerboard Pattern */
        .checkerboard {
            background-color: #e5e5e5;
            background-image: 
                linear-gradient(45deg, #d8d8d8 25%, transparent 25%), 
                linear-gradient(-45deg, #d8d8d8 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #d8d8d8 75%), 
                linear-gradient(-45deg, transparent 75%, #d8d8d8 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
    </style>
</head>
<body class="bg-black h-screen w-screen overflow-hidden flex flex-col md:flex-row">

    <!-- Hidden File Input -->
    <input type="file" id="fileInput" accept="image/*" class="hidden">

    <!-- LEFT SIDEBAR (Controls & Buttons) -->
    <aside class="w-full md:w-80 lg:w-96 bg-black flex flex-col items-center justify-between p-5 z-10 shrink-0 border-r border-neutral-800 overflow-y-auto">
        
        <!-- Top Upload Button -->
        <button id="uploadBtn" class="pill-btn bold-pill-font w-48 py-2.5 text-2xl text-black font-extrabold tracking-wide text-center shrink-0">
            upload
        </button>

        <!-- Sliders Container (Dark Grey Inner Box) -->
        <div class="bg-[#474747] w-full rounded-md p-5 my-4 flex flex-col justify-around gap-4 border border-neutral-700 shadow-inner flex-1 min-h-[520px]">
            
            <!-- Quick Preset Templates -->
            <div class="flex flex-col gap-2">
                <span class="text-xs font-bold text-gray-300 uppercase tracking-wider px-1">Templates</span>
                <div class="grid grid-cols-3 gap-1.5" id="templateBtnsContainer">
                    <button data-template="default" class="template-btn active bg-black/50 hover:bg-black/70 text-white text-[11px] py-1 px-2 rounded border border-neutral-600 font-medium transition-colors">Clean</button>
                    <button data-template="comic" class="template-btn bg-black/50 hover:bg-black/70 text-white text-[11px] py-1 px-2 rounded border border-neutral-600 font-medium transition-colors">Retro Comic</button>
                    <button data-template="cyber" class="template-btn bg-black/50 hover:bg-black/70 text-white text-[11px] py-1 px-2 rounded border border-neutral-600 font-medium transition-colors">Cyber Dot</button>
                    <button data-template="dream" class="template-btn bg-black/50 hover:bg-black/70 text-white text-[11px] py-1 px-2 rounded border border-neutral-600 font-medium transition-colors">Soft Dream</button>
                    <button data-template="vintage" class="template-btn bg-black/50 hover:bg-black/70 text-white text-[11px] py-1 px-2 rounded border border-neutral-600 font-medium transition-colors">Vintage Film</button>
                    <button data-template="noir" class="template-btn bg-black/50 hover:bg-black/70 text-white text-[11px] py-1 px-2 rounded border border-neutral-600 font-medium transition-colors">Dark Noir</button>
                </div>
            </div>

            <!-- Slider 1: Blur -->
            <div class="flex flex-col gap-1.5">
                <div class="flex justify-between items-center text-xs font-bold text-gray-300 uppercase tracking-wider px-1">
                    <span>1. Blur</span>
                    <span id="blurVal" class="text-white bg-black/40 px-2 py-0.5 rounded">0px</span>
                </div>
                <input type="range" id="blurSlider" min="0" max="25" value="0" step="0.5">
            </div>

            <!-- Slider 2: Halftone Effect -->
            <div class="flex flex-col gap-1.5">
                <div class="flex justify-between items-center text-xs font-bold text-gray-300 uppercase tracking-wider px-1">
                    <span>2. Halftone Dot</span>
                    <span id="ditherVal" class="text-white bg-black/40 px-2 py-0.5 rounded">Off</span>
                </div>
                <input type="range" id="ditherSlider" min="2" max="16" value="2" step="1">
            </div>

            <!-- Slider 3: Image Scale -->
            <div class="flex flex-col gap-1.5">
                <div class="flex justify-between items-center text-xs font-bold text-gray-300 uppercase tracking-wider px-1">
                    <span>3. Scale</span>
                    <span id="scaleVal" class="text-white bg-black/40 px-2 py-0.5 rounded">100%</span>
                </div>
                <input type="range" id="scaleSlider" min="10" max="200" value="100" step="1">
            </div>

            <!-- Brightness & Contrast Controls -->
            <div class="grid grid-cols-2 gap-2">
                <div class="flex flex-col gap-1">
                    <div class="flex justify-between items-center text-[10px] font-bold text-gray-300 uppercase tracking-wider px-1">
                        <span>Brightness</span>
                        <span id="brightnessVal" class="text-white bg-black/40 px-1.5 py-0.5 rounded">100%</span>
                    </div>
                    <input type="range" id="brightnessSlider" min="20" max="180" value="100" step="1">
                </div>
                <div class="flex flex-col gap-1">
                    <div class="flex justify-between items-center text-[10px] font-bold text-gray-300 uppercase tracking-wider px-1">
                        <span>Contrast</span>
                        <span id="contrastVal" class="text-white bg-black/40 px-1.5 py-0.5 rounded">100%</span>
                    </div>
                    <input type="range" id="contrastSlider" min="20" max="180" value="100" step="1">
                </div>
            </div>

            <!-- Gradient Map Custom Pickers & Presets -->
            <div class="flex flex-col gap-1.5">
                <div class="flex justify-between items-center text-xs font-bold text-gray-300 uppercase tracking-wider px-1">
                    <span>Gradient Map</span>
                    <select id="gradientMapSelect" class="bg-black/60 text-white text-[11px] px-2 py-0.5 rounded border border-neutral-600 focus:outline-none">
                        <option value="custom">Custom</option>
                        <option value="none">Off</option>
                        <option value="sunset">Sunset Flame</option>
                        <option value="cyber">Cyber Neon</option>
                        <option value="duotone">Duotone Teal</option>
                        <option value="sepia">Sepia Vintage</option>
                        <option value="mono">Monochrome</option>
                        <option value="emerald">Emerald Glow</option>
                    </select>
                </div>
                <!-- Color Pickers (Visible when image is loaded) -->
                <div id="colorPickersContainer" class="hidden grid-cols-2 gap-2 mt-1">
                    <label class="flex items-center justify-between bg-black/40 px-2 py-1 rounded text-[11px] text-gray-300 cursor-pointer">
                        <span>Shadows</span>
                        <input type="color" id="shadowColor" value="#0f0c29" class="w-6 h-6 border-0 rounded cursor-pointer bg-transparent">
                    </label>
                    <label class="flex items-center justify-between bg-black/40 px-2 py-1 rounded text-[11px] text-gray-300 cursor-pointer">
                        <span>Highlights</span>
                        <input type="color" id="highlightColor" value="#24243e" class="w-6 h-6 border-0 rounded cursor-pointer bg-transparent">
                    </label>
                </div>
            </div>

            <!-- Slider 4: Film Grain / Noise -->
            <div class="flex flex-col gap-1.5">
                <div class="flex justify-between items-center text-xs font-bold text-gray-300 uppercase tracking-wider px-1">
                    <span>4. Film Grain</span>
                    <span id="grainVal" class="text-white bg-black/40 px-2 py-0.5 rounded">0%</span>
                </div>
                <input type="range" id="grainSlider" min="0" max="100" value="0" step="1">
            </div>

            <!-- Helper Status Text -->
            <div class="mt-auto text-center text-xs text-neutral-400 border-t border-neutral-600/50 pt-2">
                <p id="imageDimensions">No Image Loaded</p>
            </div>
        </div>

        <!-- Bottom Export Button -->
        <button id="exportBtn" class="pill-btn bold-pill-font w-48 py-2.5 text-2xl text-black font-extrabold tracking-wide text-center shrink-0">
            export
        </button>

    </aside>

    <!-- RIGHT MAIN CONTENT (Image Display Container) -->
    <main class="flex-1 bg-[#e0e0e0] p-4 md:p-8 flex items-center justify-center relative overflow-hidden">
        
        <!-- Large Border Frame Matching Image Mockup -->
        <div id="dropZone" class="w-full h-full border border-neutral-400 rounded-sm flex items-center justify-center relative checkerboard overflow-hidden shadow-inner group">
            
            <!-- Default Placeholder State (Visible when no image uploaded) -->
            <div id="placeholder" class="flex flex-col items-center justify-center text-neutral-500 p-6 text-center cursor-pointer hover:text-neutral-700 transition-colors">
                <svg class="w-20 h-20 mb-4 opacity-70 group-hover:scale-105 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
                <p class="text-xl font-semibold mb-1">Click or Drop Image Here</p>
                <p class="text-sm opacity-75">Supports PNG, JPG, WEBP formats</p>
            </div>

            <!-- Working Canvas Display -->
            <canvas id="mainCanvas" class="max-w-full max-h-full object-contain hidden shadow-2xl"></canvas>

            <!-- Notification Toast Message -->
            <div id="toast" class="absolute top-6 right-6 bg-black text-white px-4 py-2 rounded-full text-sm font-medium shadow-lg opacity-0 transition-opacity pointer-events-none transform translate-y-[-10px]">
                Message dynamic
            </div>

        </div>

    </main>

    <!-- JavaScript Logic -->
    <script>
        // DOM Elements
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const exportBtn = document.getElementById('exportBtn');
        const dropZone = document.getElementById('dropZone');
        const placeholder = document.getElementById('placeholder');
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const imageDimensions = document.getElementById('imageDimensions');
        const toast = document.getElementById('toast');
        const colorPickersContainer = document.getElementById('colorPickersContainer');

        // Sliders & Controls
        const blurSlider = document.getElementById('blurSlider');
        const ditherSlider = document.getElementById('ditherSlider');
        const scaleSlider = document.getElementById('scaleSlider');
        const brightnessSlider = document.getElementById('brightnessSlider');
        const contrastSlider = document.getElementById('contrastSlider');
        const grainSlider = document.getElementById('grainSlider');
        const gradientMapSelect = document.getElementById('gradientMapSelect');
        const shadowColorPicker = document.getElementById('shadowColor');
        const highlightColorPicker = document.getElementById('highlightColor');
        
        const blurVal = document.getElementById('blurVal');
        const ditherVal = document.getElementById('ditherVal');
        const scaleVal = document.getElementById('scaleVal');
        const brightnessVal = document.getElementById('brightnessVal');
        const contrastVal = document.getElementById('contrastVal');
        const grainVal = document.getElementById('grainVal');

        // Preset Gradient Color Mappings
        const GRADIENT_PRESETS = {
            none: null,
            sunset: { shadow: '#2d004b', highlight: '#ff7e5f' },
            cyber: { shadow: '#000000', highlight: '#00f2fe' },
            duotone: { shadow: '#0f2027', highlight: '#2c5364' },
            sepia: { shadow: '#2b1d0c', highlight: '#f5e3c3' },
            mono: { shadow: '#000000', highlight: '#ffffff' },
            emerald: { shadow: '#052e16', highlight: '#34d399' }
        };

        // Template Configurations
        const TEMPLATES = {
            default: { blur: 0, dither: 2, scale: 100, brightness: 100, contrast: 100, grain: 0, gradient: 'none', shadow: '#000000', highlight: '#ffffff' },
            comic: { blur: 0, dither: 4, scale: 100, brightness: 110, contrast: 130, grain: 10, gradient: 'custom', shadow: '#050515', highlight: '#ffea00' },
            cyber: { blur: 1, dither: 7, scale: 100, brightness: 100, contrast: 120, grain: 20, gradient: 'cyber', shadow: '#000000', highlight: '#00f2fe' },
            dream: { blur: 2, dither: 2, scale: 100, brightness: 105, contrast: 90, grain: 15, gradient: 'custom', shadow: '#31103f', highlight: '#fca5a5' },
            vintage: { blur: 1, dither: 4, scale: 100, brightness: 95, contrast: 105, grain: 45, gradient: 'sepia', shadow: '#2b1d0c', highlight: '#f5e3c3' },
            noir: { blur: 0.5, dither: 5, scale: 100, brightness: 90, contrast: 150, grain: 60, gradient: 'mono', shadow: '#000000', highlight: '#ffffff' }
        };

        // State Variables
        let sourceImage = null;

        window.addEventListener('load', () => {
            setupEventListeners();
        });

        function setupEventListeners() {
            uploadBtn.addEventListener('click', () => fileInput.click());
            placeholder.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', handleFileSelect);

            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('border-neutral-800');
            });

            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('border-neutral-800');
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('border-neutral-800');
                if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                    loadImageFromFile(e.dataTransfer.files[0]);
                }
            });

            document.querySelectorAll('.template-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const templateKey = e.target.getAttribute('data-template');
                    applyTemplate(templateKey);
                });
            });

            blurSlider.addEventListener('input', () => {
                blurVal.textContent = `${blurSlider.value}px`;
                clearActiveTemplates();
                requestRender();
            });

            ditherSlider.addEventListener('input', () => {
                const val = parseInt(ditherSlider.value);
                ditherVal.textContent = val <= 2 ? 'Off' : `${val}x`;
                clearActiveTemplates();
                requestRender();
            });

            scaleSlider.addEventListener('input', () => {
                scaleVal.textContent = `${scaleSlider.value}%`;
                clearActiveTemplates();
                requestRender();
            });

            brightnessSlider.addEventListener('input', () => {
                brightnessVal.textContent = `${brightnessSlider.value}%`;
                clearActiveTemplates();
                requestRender();
            });

            contrastSlider.addEventListener('input', () => {
                contrastVal.textContent = `${contrastSlider.value}%`;
                clearActiveTemplates();
                requestRender();
            });

            grainSlider.addEventListener('input', () => {
                grainVal.textContent = `${grainSlider.value}%`;
                clearActiveTemplates();
                requestRender();
            });

            gradientMapSelect.addEventListener('change', () => {
                const val = gradientMapSelect.value;
                if (GRADIENT_PRESETS[val]) {
                    shadowColorPicker.value = GRADIENT_PRESETS[val].shadow;
                    highlightColorPicker.value = GRADIENT_PRESETS[val].highlight;
                }
                clearActiveTemplates();
                requestRender();
            });

            shadowColorPicker.addEventListener('input', () => {
                gradientMapSelect.value = 'custom';
                clearActiveTemplates();
                requestRender();
            });

            highlightColorPicker.addEventListener('input', () => {
                gradientMapSelect.value = 'custom';
                clearActiveTemplates();
                requestRender();
            });

            exportBtn.addEventListener('click', exportImage);
        }

        function applyTemplate(key) {
            const t = TEMPLATES[key];
            if (!t) return;

            blurSlider.value = t.blur;
            ditherSlider.value = t.dither;
            scaleSlider.value = t.scale;
            brightnessSlider.value = t.brightness;
            contrastSlider.value = t.contrast;
            grainSlider.value = t.grain;
            gradientMapSelect.value = t.gradient;

            if (t.shadow) shadowColorPicker.value = t.shadow;
            if (t.highlight) highlightColorPicker.value = t.highlight;

            blurVal.textContent = `${t.blur}px`;
            ditherVal.textContent = t.dither <= 2 ? 'Off' : `${t.dither}x`;
            scaleVal.textContent = `${t.scale}%`;
            brightnessVal.textContent = `${t.brightness}%`;
            contrastVal.textContent = `${t.contrast}%`;
            grainVal.textContent = `${t.grain}%`;

            document.querySelectorAll('.template-btn').forEach(b => {
                if (b.getAttribute('data-template') === key) {
                    b.classList.add('border-white', 'bg-neutral-800', 'font-bold');
                    b.classList.remove('border-neutral-600', 'bg-black/50');
                } else {
                    b.classList.remove('border-white', 'bg-neutral-800', 'font-bold');
                    b.classList.add('border-neutral-600', 'bg-black/50');
                }
            });

            requestRender();
        }

        function clearActiveTemplates() {
            document.querySelectorAll('.template-btn').forEach(b => {
                b.classList.remove('border-white', 'bg-neutral-800', 'font-bold');
                b.classList.add('border-neutral-600', 'bg-black/50');
            });
        }

        function handleFileSelect(e) {
            if (e.target.files && e.target.files[0]) {
                loadImageFromFile(e.target.files[0]);
            }
        }

        function loadImageFromFile(file) {
            if (!file.type.match('image.*')) {
                showToast("Please upload an image file.");
                return;
            }

            const reader = new FileReader();
            reader.onload = function (event) {
                const img = new Image();
                img.onload = function () {
                    sourceImage = img;
                    placeholder.classList.add('hidden');
                    canvas.classList.remove('hidden');
                    
                    // Show custom color pickers only when image is loaded
                    colorPickersContainer.classList.remove('hidden');
                    colorPickersContainer.classList.add('grid');

                    imageDimensions.textContent = `${img.width} × ${img.height} px`;
                    showToast("Image loaded successfully!");

                    renderEffects();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        let renderRequested = false;
        function requestRender() {
            if (!renderRequested) {
                renderRequested = true;
                requestAnimationFrame(() => {
                    renderEffects();
                    renderRequested = false;
                });
            }
        }

        function hexToRgb(hex) {
            let c = hex.replace('#', '');
            if (c.length === 3) c = c.split('').map(x => x + x).join('');
            const num = parseInt(c, 16);
            return {
                r: (num >> 16) & 255,
                g: (num >> 8) & 255,
                b: num & 255
            };
        }

        function renderEffects() {
            if (!sourceImage) return;

            // 1. Calculate Scaled Dimensions
            const scaleFactor = parseFloat(scaleSlider.value) / 100;
            const width = Math.max(1, Math.round(sourceImage.width * scaleFactor));
            const height = Math.max(1, Math.round(sourceImage.height * scaleFactor));

            canvas.width = width;
            canvas.height = height;
            imageDimensions.textContent = `${width} × ${height} px (${scaleSlider.value}%)`;

            const offCanvas = document.createElement('canvas');
            offCanvas.width = width;
            offCanvas.height = height;
            const offCtx = offCanvas.getContext('2d');

            // 2. Apply Brightness, Contrast, and Blur Filters
            const blurAmount = parseFloat(blurSlider.value);
            const brightness = brightnessSlider.value;
            const contrast = contrastSlider.value;

            offCtx.filter = `blur(${blurAmount}px) brightness(${brightness}%) contrast(${contrast}%)`;
            offCtx.drawImage(sourceImage, 0, 0, width, height);
            offCtx.filter = 'none';

            // 3. Apply Gradient Mapping (Photoshop style)
            if (gradientMapSelect.value !== 'none') {
                applyGradientMap(offCtx, width, height, shadowColorPicker.value, highlightColorPicker.value);
            }

            // 4. Apply Halftone Dot Effect
            const halftoneCellSize = parseInt(ditherSlider.value);
            if (halftoneCellSize > 2) {
                applyHalftoneEffect(offCtx, width, height, halftoneCellSize);
            }

            // 5. Apply Film Grain Noise
            const grainAmount = parseInt(grainSlider.value);
            if (grainAmount > 0) {
                applyFilmGrain(offCtx, width, height, grainAmount);
            }

            ctx.clearRect(0, 0, width, height);
            ctx.drawImage(offCanvas, 0, 0);
        }

        function applyGradientMap(context, width, height, shadowHex, highlightHex) {
            const imgData = context.getImageData(0, 0, width, height);
            const data = imgData.data;

            const shadow = hexToRgb(shadowHex);
            const highlight = hexToRgb(highlightHex);

            for (let i = 0; i < data.length; i += 4) {
                const lum = (0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]) / 255;
                data[i] = shadow.r + lum * (highlight.r - shadow.r);
                data[i + 1] = shadow.g + lum * (highlight.g - shadow.g);
                data[i + 2] = shadow.b + lum * (highlight.b - shadow.b);
            }

            context.putImageData(imgData, 0, 0);
        }

        function applyHalftoneEffect(context, width, height, cellSize) {
            const imgData = context.getImageData(0, 0, width, height);
            const data = imgData.data;

            context.fillStyle = '#ffffff';
            context.fillRect(0, 0, width, height);

            for (let y = 0; y < height; y += cellSize) {
                for (let x = 0; x < width; x += cellSize) {
                    const centerX = Math.min(width - 1, Math.floor(x + cellSize / 2));
                    const centerY = Math.min(height - 1, Math.floor(y + cellSize / 2));
                    const index = (centerY * width + centerX) * 4;

                    const r = data[index];
                    const g = data[index + 1];
                    const b = data[index + 2];

                    const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
                    const radius = (1 - luminance) * (cellSize * 0.75);

                    if (radius > 0.3) {
                        context.beginPath();
                        context.fillStyle = `rgb(${r}, ${g}, ${b})`;
                        context.arc(x + cellSize / 2, y + cellSize / 2, radius, 0, Math.PI * 2);
                        context.fill();
                    }
                }
            }
        }

        function applyFilmGrain(context, width, height, intensity) {
            const imgData = context.getImageData(0, 0, width, height);
            const data = imgData.data;
            const strength = intensity * 1.25;

            for (let i = 0; i < data.length; i += 4) {
                const noise = (Math.random() - 0.5) * strength;
                data[i] = Math.min(255, Math.max(0, data[i] + noise));
                data[i + 1] = Math.min(255, Math.max(0, data[i + 1] + noise));
                data[i + 2] = Math.min(255, Math.max(0, data[i + 2] + noise));
            }

            context.putImageData(imgData, 0, 0);
        }

        function exportImage() {
            if (!sourceImage) {
                showToast("Please upload an image first!");
                return;
            }

            const link = document.createElement('a');
            link.download = `design-export-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();

            showToast("Exported PNG successfully!");
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.remove('opacity-0', 'translate-y-[-10px]');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-[-10px]');
            }, 2500);
        }
    </script>
</body>
</html>
